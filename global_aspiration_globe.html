<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Aspiration Globe</title>
<style>
:root{
  --bg:#F7F5F1; --panel:#FFFFFF; --ink:#2B2B2B; --muted:#6E6A64; --line:#E7E1D6;
  --gold:#E0A458; --gold-soft:#FBF1E3; --dark:#262626; --warn:#9A5B00; --warn-bg:#FFF6E5;
  --font:"Aptos","Aptos Display","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:700}
a{color:#A8641A}
button{font-family:var(--font);font-weight:700;cursor:pointer}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:22px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
header img{height:72px;width:auto;display:block}
.hdiv{width:1px;align-self:stretch;background:var(--line)}
.htitle h1{margin:0;font-size:24px;letter-spacing:.2px;color:var(--dark)}
.htitle h2{margin:4px 0 0;font-size:17px;color:var(--gold);font-weight:700}
.hmeta{margin-left:auto;text-align:right;color:var(--muted);font-size:13px;line-height:1.5}
.hmeta b{color:var(--dark)}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) 460px;height:calc(100% - 101px);min-height:560px}
#stage{position:relative;overflow:hidden}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#globe.dragging{cursor:grabbing}

/* overlays on the globe */
.chips{position:absolute;left:18px;top:16px;display:flex;flex-direction:column;gap:6px;z-index:2}
.chip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.92);font-size:13px;color:var(--ink);text-align:left;transition:all .15s}
.chip .sw{width:14px;height:14px;border-radius:50%;flex:none}
.chip:hover{border-color:#cfc6b8}
.chip.on{color:#fff;border-color:transparent}
.chip.off{opacity:.45}
.chip.all{justify-content:center;margin-top:4px;color:var(--muted)}
.controls{position:absolute;left:18px;bottom:16px;display:flex;gap:10px;align-items:center;z-index:2;flex-wrap:wrap}
.seg{display:flex;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 13px;font-size:13px;color:var(--ink)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--dark);color:#fff}
.hint{position:absolute;right:16px;bottom:14px;font-size:12px;color:var(--muted);font-weight:400;z-index:2;text-align:right}
#tip{position:absolute;pointer-events:none;z-index:5;background:var(--dark);color:#fff;padding:8px 10px;border-radius:8px;font-size:12px;
  max-width:260px;opacity:0;transition:opacity .12s;line-height:1.4}
#tip .tn{font-size:13px;margin-bottom:4px}
#tip .tl{display:flex;align-items:center;gap:6px;font-weight:400}
#tip .tl i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---------- side panel ---------- */
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 10px}
.tabs button{flex:1;border:0;background:none;padding:14px 4px 12px;font-size:14px;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--dark);border-bottom-color:var(--gold)}
.pane{flex:1;overflow:auto;padding:18px 20px 28px;display:none}
.pane.on{display:block}
.empty{color:var(--muted);font-weight:400;line-height:1.55;font-size:14px}
.btn{border:1px solid var(--line);background:var(--gold-soft);color:var(--dark);padding:8px 12px;border-radius:8px;font-size:13px}
.city-h{display:flex;align-items:flex-start;gap:12px}
.city-h h3{margin:0;font-size:21px;line-height:1.2}
.role{display:inline-block;margin-top:5px;font-size:12px;padding:3px 9px;border-radius:999px;background:#EFEBE4;color:var(--muted)}
.role.home{background:var(--dark);color:#fff}
.coords{font-size:12px;color:var(--muted);font-weight:400;margin-top:6px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.badge{font-size:11.5px;padding:4px 9px;border-radius:999px;color:#fff}
.group{border:1px solid var(--line);border-left:5px solid #999;border-radius:10px;padding:12px 14px;margin-top:14px}
.group h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.metric{padding:9px 0;border-top:1px dashed var(--line)}
.metric:first-of-type{border-top:0}
.mname{font-size:13px;color:var(--muted)}
.mval{font-size:19px;margin-top:2px}
.mval small{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
.mlabel{font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.scorebar{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
.track{flex:1;height:7px;border-radius:4px;background:#F0ECE5;overflow:hidden}
.fill{height:100%;border-radius:4px}
.cmp{font-size:12px;font-weight:400;color:var(--ink);margin-top:5px;line-height:1.45}
.src{font-size:11.5px;font-weight:400;color:var(--muted);margin-top:6px;line-height:1.45}
.src a{word-break:break-word}
.nodata{font-size:13px;font-weight:400;color:var(--muted);line-height:1.5}
details{margin-top:10px}
summary{font-size:13px;cursor:pointer;color:var(--dark)}
.ctx{font-size:12.5px;font-weight:400;line-height:1.5;padding:8px 0;border-top:1px dashed var(--line)}
.ctx b{font-weight:700}
.ind-h{border-radius:12px;padding:14px 16px;color:#fff}
.ind-h h3{margin:0;font-size:20px}
.ind-h p{margin:5px 0 0;font-size:13px;font-weight:400;opacity:.95}
.ind-sel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ind-sel button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:12px;display:flex;align-items:center;gap:6px}
.ind-sel button i{width:10px;height:10px;border-radius:50%;display:inline-block}
.ind-sel button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.sub{margin-top:18px}
.sub h4{margin:0;font-size:15px}
.sub .unit{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.sub .note{font-size:12px;font-weight:400;color:var(--muted);margin-top:4px;font-style:italic}
.rows{margin-top:8px}
.row{display:grid;grid-template-columns:150px 1fr 92px;align-items:center;gap:10px;padding:6px 6px;border-radius:7px;cursor:pointer}
.row:hover{background:#F7F4EE}
.row.acr{background:var(--gold-soft)}
.row.sel{outline:2px solid var(--gold)}
.row .rc{font-size:12.5px;line-height:1.25}
.row .rc span{display:block;font-size:11px;color:var(--muted);font-weight:400}
.row .rv{font-size:12.5px;text-align:right}
.row .rb .track{height:9px}
.row.nopin{cursor:default}
.sec-t{margin:22px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.recsub{margin-top:12px}
.recsub h5{margin:0 0 6px;font-size:13px;color:var(--dark)}
.rec{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.rec .rn{width:22px;height:22px;border-radius:50%;color:#fff;font-size:11.5px;display:flex;align-items:center;justify-content:center}
.rec .rt{font-size:12.5px;font-weight:400;line-height:1.5}
.rec .rm{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.rec .rm span{font-size:11px;padding:2px 8px;border-radius:999px;background:#F1EDE6;color:var(--muted);font-weight:700}
.rec .rm span.when{background:var(--gold-soft);color:#8A5414}
.warn{background:var(--warn-bg);border:1px solid #F1D9A8;border-radius:10px;padding:10px 12px;margin-top:10px}
.warn div{font-size:12.5px;font-weight:400;color:#5A3D00;line-height:1.5;padding:3px 0}
.warn div::before{content:"⚠ ";color:var(--warn)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-family:var(--font);font-size:14px;margin-bottom:10px}
.clist{display:flex;flex-direction:column;gap:2px}
.citem{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:8px;cursor:pointer;border:0;background:none;text-align:left;font-size:14px;color:var(--ink)}
.citem:hover{background:#F7F4EE}
.citem.sel{background:var(--gold-soft)}
.citem canvas{flex:none}
.citem .cn{flex:1}
.citem .cc{font-size:12px;color:var(--muted);font-weight:400}
.srcgrp{margin-top:16px}
.srcgrp h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}
.srcgrp h4 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.srcgrp li{font-size:12.5px;font-weight:400;line-height:1.5;margin-bottom:4px}
.srcgrp ul{margin:0;padding-left:18px}
.srcgrp .for{color:var(--muted)}

@media (max-width:980px){
  main{grid-template-columns:1fr;height:auto}
  #stage{height:72vh;min-height:420px}
  aside{border-left:0;border-top:1px solid var(--line);max-height:none}
  .pane{max-height:none}
  header{flex-wrap:wrap;padding:12px 16px}
  header img{height:48px}
  .hmeta{margin-left:0;text-align:left;width:100%}
  .htitle h1{font-size:19px}
  .row{grid-template-columns:120px 1fr 80px}
  .chips{top:10px;left:10px}
  .chip{font-size:11.5px;padding:4px 9px 4px 6px}
}
</style>
</head>

/* ---------------- cities ---------------- */
const cities = Object.keys(DATA.locations).map(name => {
  const [lat, lon] = DATA.locations[name];
  const inds = IND.filter(k => DATA.indicator_cities[k].indexOf(name) >= 0);
  return {name, lat, lon, inds, home: name === HOME, sx:0, sy:0, dx:0, dy:0, z:0, vis:false};
});
const cityByName = {}; cities.forEach(c => cityByName[c.name] = c);

/* ---------------- land raster from TopoJSON ---------------- */
function decodeArcs(topo){
  const t = topo.transform;
  return topo.arcs.map(arc => {
    let x=0, y=0;
    return arc.map(p => { x += p[0]; y += p[1]; return t ? [x*t.scale[0]+t.translate[0], y*t.scale[1]+t.translate[1]] : [p[0],p[1]]; });
  });
}
function ringCoords(ringArcs, arcs){
  const out = [];
  ringArcs.forEach(i => {
    let a = i >= 0 ? arcs[i] : arcs[~i].slice().reverse();
    a.forEach((p, k) => { if (k > 0 || out.length === 0) out.push(p); });
  });
  return out;
}
function landPolygons(topo){
  const arcs = decodeArcs(topo), polys = [];
  function geom(g){
    if (g.type === "GeometryCollection") g.geometries.forEach(geom);
    else if (g.type === "Polygon") polys.push(g.arcs.map(r => ringCoords(r, arcs)));
    else if (g.type === "MultiPolygon") g.arcs.forEach(p => polys.push(p.map(r => ringCoords(r, arcs))));
  }
  Object.values(topo.objects).forEach(geom);
  return polys;
}
const RW = 3600, RH = 1800;
const land = document.createElement("canvas"); land.width = RW; land.height = RH;
(function(){
  const g = land.getContext("2d");
  g.fillStyle = "#000";
  // unwrap longitudes so rings that cross the 180° line stay continuous
  function unwrap(ring){
    const out = []; let prev = null, shift = 0;
    ring.forEach(p => {
      if (prev !== null){ const d = p[0] - prev; if (d > 180) shift -= 360; else if (d < -180) shift += 360; }
      prev = p[0]; out.push([p[0] + shift, p[1]]);
    });
    const span = out[out.length-1][0] - out[0][0];
    if (Math.abs(span) > 180){ // ring goes round a pole (Antarctica): close it through the pole
      let s = 0; out.forEach(p => s += p[1]);
      const pole = s < 0 ? -90 : 90;
      out.push([out[out.length-1][0], pole], [out[0][0], pole]);
    }
    return out;
  }
  landPolygons(LAND).forEach(poly => {
    const rings = poly.map(unwrap);
    g.beginPath();
    [-360, 0, 360].forEach(off => {
      rings.forEach(ring => {
        ring.forEach((p, k) => {
          const x = (p[0]+off+180)/360*RW, y = (90-p[1])/180*RH;
          if (k === 0) g.moveTo(x, y); else g.lineTo(x, y);
        });
        g.closePath();
      });
    });
    g.fill("evenodd");
  });
})();
const landPx = land.getContext("2d").getImageData(0,0,RW,RH).data;
function isLand(lat, lon){
  const x = Math.min(RW-1, Math.max(0, Math.floor((lon+180)/360*RW)));
  const y = Math.min(RH-1, Math.max(0, Math.floor((90-lat)/180*RH)));
  return landPx[(y*RW+x)*4+3] > 100;
}
function makeGrid(step){
  const pts = [];
  for (let lat = -90 + step/2; lat < 90; lat += step){
    const n = Math.max(1, Math.round(360*Math.cos(lat*D2R)/step));
    const off = (Math.round(lat/step) % 2) * 0.5;
    for (let i = 0; i < n; i++){
      const lon = -180 + (i + off) * 360/n;
      if (isLand(lat, lon)) pts.push(Math.sin(lat*D2R), Math.cos(lat*D2R), lon*D2R);
    }
  }
  return new Float32Array(pts);
}
const GRID_C = makeGrid(1.5), GRID_F = makeGrid(0.6);
const STEP_C = 1.5*D2R, STEP_F = 0.6*D2R;

/* ---------------- view state ---------------- */
const cv = document.getElementById("globe"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
const view = {lon: -72.6, lat: 15, k: 1};     // centre of view (we look at lon=-view.lon)
const SPEEDS = {slow:4, medium:10, fast:22, pause:0};
let speedKey = "medium", autoRot = SPEEDS.medium;
let activeInd = null, selected = null, hovered = null;
let anim = null, dragging = false, lastT = performance.now(), pulse = 0;

function resize(){
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
}
window.addEventListener("resize", resize);
function baseR(){ return Math.min(W, H) * 0.40; }
function center(){ return [W*0.54, H*0.52]; }

function project(sinLat, cosLat, lonRad, out){
  const l0 = view.lon*D2R, p0 = view.lat*D2R;
  const dl = lonRad + l0;
  const cdl = Math.cos(dl);
  const sp = Math.sin(p0), cp = Math.cos(p0);
  out[0] = cosLat*Math.sin(dl);
  out[1] = cp*sinLat - sp*cosLat*cdl;
  out[2] = sp*sinLat + cp*cosLat*cdl;
}

/* ---------------- drawing ---------------- */
const tmp = [0,0,0];
function drawDots(grid, step, alpha, R, cx, cy){
  if (alpha <= 0.01) return;
  const size = Math.max(1.1, R*step*0.5);
  const half = size/2, round = size > 2.6;
  const buckets = [[],[],[],[]];
  const l0 = view.lon*D2R, p0 = view.lat*D2R, sp = Math.sin(p0), cp = Math.cos(p0);
  for (let i = 0; i < grid.length; i += 3){
    const sLat = grid[i], cLat = grid[i+1], dl = grid[i+2] + l0;
    const cdl = Math.cos(dl);
    const z = sp*sLat + cp*cLat*cdl;
    if (z <= 0) continue;
    const x = cx + R*cLat*Math.sin(dl);
    const y = cy - R*(cp*sLat - sp*cLat*cdl);
    if (x < -5 || y < -5 || x > W+5 || y > H+5) continue;
    const b = z > 0.6 ? 3 : z > 0.35 ? 2 : z > 0.15 ? 1 : 0;
    buckets[b].push(x - half, y - half);
  }
  const alphas = [0.28, 0.5, 0.72, 0.9];
  ctx.fillStyle = "#7F8B99";
  for (let b = 0; b < 4; b++){
    const arr = buckets[b]; if (!arr.length) continue;
    ctx.globalAlpha = alphas[b]*alpha;
    ctx.beginPath();
    if (round) for (let j = 0; j < arr.length; j += 2){ ctx.moveTo(arr[j] + size, arr[j+1] + half); ctx.arc(arr[j] + half, arr[j+1] + half, half, 0, 6.2832); }
    else for (let j = 0; j < arr.length; j += 2) ctx.rect(arr[j], arr[j+1], size, size);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function ringPath(x, y, r, inds, thick, alpha){
  const n = inds.length;
  const gap = n > 1 ? 0.16 : 0;
  for (let i = 0; i < n; i++){
    const a0 = -Math.PI/2 + i*2*Math.PI/n + gap/2;
    const a1 = -Math.PI/2 + (i+1)*2*Math.PI/n - gap/2;
    ctx.beginPath(); ctx.arc(x, y, r, a0, a1);
    ctx.strokeStyle = DATA.colours[inds[i]]; ctx.lineWidth = thick; ctx.globalAlpha = alpha; ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function markerR(c){ const s = Math.min(1.5, 0.85 + 0.15*view.k); return (c.home ? 11 : 7.5) * s; }

function cityShown(c){ return !activeInd || c.inds.indexOf(activeInd) >= 0; }

function layoutMarkers(R, cx, cy){
  const vis = [];
  cities.forEach(c => {
    project(Math.sin(c.lat*D2R), Math.cos(c.lat*D2R), c.lon*D2R, tmp);
    c.z = tmp[2]; c.sx = cx + R*tmp[0]; c.sy = cy - R*tmp[1];
    c.vis = c.z > 0.04 && c.sx > -30 && c.sy > -30 && c.sx < W+30 && c.sy < H+30;
    c.dx = c.sx; c.dy = c.sy;
    if (c.vis && cityShown(c)) vis.push(c);
  });
  // nudge overlapping markers apart (home and selected stay put)
  for (let it = 0; it < 8; it++){
    for (let i = 0; i < vis.length; i++) for (let j = i+1; j < vis.length; j++){
      const a = vis[i], b = vis[j];
      const min = markerR(a) + markerR(b) + 3;
      let ddx = b.dx - a.dx, ddy = b.dy - a.dy, d = Math.hypot(ddx, ddy);
      if (d >= min) continue;
      if (d < 0.01){ ddx = 1; ddy = 0; d = 1; }
      const push = (min - d), ux = ddx/d, uy = ddy/d;
      const fa = (a.home || a === selected) ? 0 : (b.home || b === selected) ? 1 : 0.5;
      const fb = 1 - fa;
      a.dx -= ux*push*fa; a.dy -= uy*push*fa; b.dx += ux*push*fb; b.dy += uy*push*fb;
    }
  }
  return vis;
}

function drawMarkers(vis){
  // tethers first
  vis.forEach(c => {
    if (Math.hypot(c.dx - c.sx, c.dy - c.sy) > 1.5){
      ctx.globalAlpha = muted(c) ? 0.25 : 0.7;
      ctx.strokeStyle = "#555"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(c.sx, c.sy); ctx.lineTo(c.dx, c.dy); ctx.stroke();
      ctx.fillStyle = "#333"; ctx.beginPath(); ctx.arc(c.sx, c.sy, 1.8, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
  });
  const order = vis.slice().sort((a,b) => (a.home - b.home) || ((a===selected) - (b===selected)));
  order.forEach(c => {
    const r = markerR(c), edge = Math.min(1, c.z/0.25);
    const alpha = (muted(c) ? 0.28 : 1) * edge;
    const inds = activeInd ? [activeInd] : c.inds;
    if (c.home){
      const t = (pulse % 2000)/2000;
      ctx.globalAlpha = (1-t)*0.45*alpha; ctx.fillStyle = DATA.colours["Economic Scale"];
      ctx.beginPath(); ctx.arc(c.dx, c.dy, r + 4 + t*18, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (c === selected || c === hovered){
      ctx.globalAlpha = 0.9*edge; ctx.strokeStyle = "#E0A458"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(c.dx, c.dy, r + 6, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.globalAlpha = alpha; ctx.fillStyle = c.home ? "#262626" : "#FFFFFF";
    ctx.beginPath(); ctx.arc(c.dx, c.dy, r, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    ringPath(c.dx, c.dy, r, inds, c.home ? 4.5 : 3.6, alpha);
    if (!c.home){ ctx.globalAlpha = alpha; ctx.fillStyle = "#262626"; ctx.beginPath(); ctx.arc(c.dx, c.dy, 1.8, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
  });
}
function muted(c){ return selected && c !== selected; }

function shortName(c){ return c.home ? "Ahmedabad-Gandhinagar (ACR)" : c.name; }
function drawLabels(vis){
  const placed = [];
  vis.forEach(c => { const r = markerR(c)+2; placed.push([c.dx-r, c.dy-r, c.dx+r, c.dy+r]); });
  const prio = vis.slice().sort((a,b) => score(b) - score(a));
  function score(c){ return (c.home?1000:0) + (c===selected?900:0) + (c===hovered?800:0) + c.inds.length*10 + c.z; }
  ctx.textBaseline = "middle";
  prio.forEach(c => {
    const must = c.home || c === selected;
    if (selected && !must && c !== hovered) return;
    const pill = c.home || c === selected;
    const fs = pill ? 13 : 12;
    ctx.font = "700 " + fs + "px " + getComputedStyle(document.body).fontFamily;
    const text = shortName(c);
    const tw = ctx.measureText(text).width + (pill ? 16 : 6), th = pill ? 22 : 16;
    const r = markerR(c) + 5;
    const cands = [];
    [1, 2.2, 3.6].forEach((m, mi) => {
      const o = r * m;
      cands.push([c.dx + o, c.dy - th/2, mi], [c.dx - o - tw, c.dy - th/2, mi], [c.dx - tw/2, c.dy - o - th, mi], [c.dx - tw/2, c.dy + o, mi],
                 [c.dx + o*0.8, c.dy - o*0.8 - th, mi], [c.dx - o*0.8 - tw, c.dy - o*0.8 - th, mi], [c.dx + o*0.8, c.dy + o*0.8, mi], [c.dx - o*0.8 - tw, c.dy + o*0.8, mi]);
    });
    let pick = null;
    for (const p of cands){
      const box = [p[0], p[1], p[0]+tw, p[1]+th];
      if (box[0] < 4 || box[1] < 4 || box[2] > W-4 || box[3] > H-4) continue;
      let hit = false;
      for (const q of placed){ if (box[0] < q[2] && box[2] > q[0] && box[1] < q[3] && box[3] > q[1]){ hit = true; break; } }
      if (!hit){ pick = p; break; }
    }
    if (!pick){ if (!must) return; pick = cands[0]; }
    const box = [pick[0], pick[1], pick[0]+tw, pick[1]+th];
    placed.push(box);
    const alpha = (muted(c) && c !== hovered ? 0.55 : 1) * Math.min(1, c.z/0.25);
    ctx.globalAlpha = alpha;
    if (pick[2] > 0){ // leader line
      const lx = Math.max(box[0], Math.min(c.dx, box[2])), ly = Math.max(box[1], Math.min(c.dy, box[3]));
      ctx.strokeStyle = "#777"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(c.dx, c.dy); ctx.lineTo(lx, ly); ctx.stroke();
    }
    if (pill){
      ctx.fillStyle = c.home ? "#262626" : "#E0A458";
      roundRect(box[0], box[1], tw, th, th/2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.fillText(text, box[0] + 8, box[1] + th/2 + 0.5);
    } else {
      ctx.lineWidth = 3.5; ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineJoin = "round";
      ctx.strokeText(text, box[0] + 3, box[1] + th/2); ctx.fillStyle = "#2B2B2B"; ctx.fillText(text, box[0] + 3, box[1] + th/2);
    }
    ctx.globalAlpha = 1;
  });
}
function roundRect(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }

let visCache = [];
function frame(t){
  const dt = Math.min(0.05, (t - lastT)/1000); lastT = t; pulse += dt*1000;
  if (anim){
    const u = Math.min(1, (t - anim.t0)/anim.dur), e = u < .5 ? 2*u*u : 1 - Math.pow(-2*u+2, 2)/2;
    view.lon = anim.a.lon + (anim.b.lon - anim.a.lon)*e;
    view.lat = anim.a.lat + (anim.b.lat - anim.a.lat)*e;
    view.k = anim.a.k + (anim.b.k - anim.a.k)*e;
    if (u >= 1) anim = null;
  } else if (!dragging && !selected && !frozen){
    view.lon += autoRot*dt;
  }
  if (view.lon > 180) view.lon -= 360; if (view.lon < -180) view.lon += 360;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const R = baseR()*view.k, [cx, cy] = center();
  // atmosphere and ocean
  const glow = ctx.createRadialGradient(cx, cy, R*0.98, cx, cy, R*1.10);
  glow.addColorStop(0, "rgba(224,164,88,0.20)"); glow.addColorStop(1, "rgba(224,164,88,0)");
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, R*1.10, 0, 7); ctx.fill();
  const ocean = ctx.createRadialGradient(cx - R*0.35, cy - R*0.4, R*0.1, cx, cy, R);
  ocean.addColorStop(0, "#FFFFFF"); ocean.addColorStop(1, "#E6EAEF");
  ctx.fillStyle = ocean; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  ctx.strokeStyle = "#D5DBE2"; ctx.lineWidth = 1; ctx.stroke();

  const f = Math.max(0, Math.min(1, (view.k - 1.35)/0.5));
  drawDots(GRID_C, STEP_C, 1 - f, R, cx, cy);
  drawDots(GRID_F, STEP_F, f, R, cx, cy);

  visCache = layoutMarkers(R, cx, cy);
  drawMarkers(visCache);
  drawLabels(visCache);
  requestAnimationFrame(frame);
}
let frozen = false;

/* ---------------- interaction ---------------- */
function flyTo(lon, lat, k, dur){
  let tl = -lon;
  let d = tl - view.lon; while (d > 180) d -= 360; while (d < -180) d += 360;
  anim = {t0: performance.now(), dur: dur || 900, a: {lon: view.lon, lat: view.lat, k: view.k}, b: {lon: view.lon + d, lat: Math.max(-70, Math.min(70, lat)), k: k}};
}
function selectCity(name, fly){
  const c = cityByName[name]; if (!c) return;
  if (activeInd && c.inds.indexOf(activeInd) < 0){ activeInd = null; renderChips(); }
  selected = c;
  if (fly !== false) flyTo(c.lon, c.lat, Math.max(view.k, 1.9));
  renderCity(); renderList(); setTab("city");
  if (indOpen) renderInd();
}
function deselect(){ selected = null; renderCity(); renderList(); if (indOpen) renderInd(); }

function pickAt(x, y){
  let best = null, bd = 1e9;
  visCache.forEach(c => { const d = Math.hypot(c.dx - x, c.dy - y); if (d < markerR(c) + 6 && d < bd){ bd = d; best = c; } });
  return best;
}
let down = null;
cv.addEventListener("pointerdown", e => { down = {x: e.offsetX, y: e.offsetY, lon: view.lon, lat: view.lat, moved: false}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (down){
    const dx = e.offsetX - down.x, dy = e.offsetY - down.y;
    if (!down.moved && Math.hypot(dx, dy) > 4){ down.moved = true; dragging = true; cv.classList.add("dragging"); anim = null; }
    if (down.moved){
      const R = baseR()*view.k;
      view.lon = down.lon + dx/R/D2R;
      view.lat = Math.max(-80, Math.min(80, down.lat + dy/R/D2R));
    }
    return;
  }
  const c = pickAt(e.offsetX, e.offsetY);
  if (c !== hovered){ hovered = c; cv.style.cursor = c ? "pointer" : "grab"; }
  showTip(c, e.offsetX, e.offsetY);
});
cv.addEventListener("pointerup", e => {
  if (down && !down.moved){
    const c = pickAt(e.offsetX, e.offsetY);
    if (c) selectCity(c.name); else if (selected) deselect();
  }
  down = null; dragging = false; cv.classList.remove("dragging");
});
cv.addEventListener("pointerleave", () => { hovered = null; showTip(null); });
cv.addEventListener("wheel", e => { e.preventDefault(); anim = null; view.k = clampK(view.k * Math.exp(-e.deltaY*0.0012)); }, {passive: false});
function clampK(k){ return Math.max(0.75, Math.min(7, k)); }
document.getElementById("zin").onclick = () => flyTo(-view.lon, view.lat, clampK(view.k*1.4), 400);
document.getElementById("zout").onclick = () => flyTo(-view.lon, view.lat, clampK(view.k/1.4), 400);
document.getElementById("zreset").onclick = () => { deselect(); flyTo(72.6, 15, 1, 800); };
document.addEventListener("keydown", e => { if (e.key === "Escape") deselect(); });
document.querySelectorAll("#speed button").forEach(b => b.onclick = () => {
  speedKey = b.dataset.s; autoRot = SPEEDS[speedKey];
  document.querySelectorAll("#speed button").forEach(x => x.classList.toggle("on", x === b));
});

const tip = document.getElementById("tip");
function showTip(c, x, y){
  if (!c){ tip.style.opacity = 0; return; }
  tip.innerHTML = '<div class="tn">' + esc(c.name) + (c.home ? " · Home city" : "") + "</div>" +
    c.inds.map(k => '<div class="tl"><i style="background:' + DATA.colours[k] + '"></i>' + esc(k) + "</div>").join("") +
    '<div class="tl" style="margin-top:4px;opacity:.75">Click for data</div>';
  const st = document.getElementById("stage").getBoundingClientRect();
  tip.style.left = Math.min(x + 16, st.width - 270) + "px"; tip.style.top = Math.min(y + 12, st.height - 160) + "px";
  tip.style.opacity = 1;
}

/* ---------------- chips (filter + indicator tab) ---------------- */
const chipsEl = document.getElementById("chips");
function renderChips(){
  chipsEl.innerHTML = "";
  IND.forEach(k => {
    const b = document.createElement("button");
    b.className = "chip" + (activeInd === k ? " on" : activeInd ? " off" : "");
    if (activeInd === k) b.style.background = DATA.colours[k];
    b.innerHTML = '<span class="sw" style="background:' + DATA.colours[k] + ';' + (activeInd === k ? "box-shadow:0 0 0 2px #fff inset" : "") + '"></span>' + esc(k);
    b.onclick = () => setIndicator(activeInd === k ? null : k, true);
    chipsEl.appendChild(b);
  });
  const all = document.createElement("button");
  all.className = "chip all"; all.textContent = "Show all";
  all.onclick = () => setIndicator(null, false);
  chipsEl.appendChild(all);
}
let indOpen = null;
function setIndicator(k, openTab){
  activeInd = k;
  if (selected && k && selected.inds.indexOf(k) < 0) selected = null;
  renderChips(); renderList();
  if (k){ indOpen = k; renderInd(); if (openTab) setTab("ind"); }
  renderCity();
}

/* ---------------- side panel ---------------- */
const tabs = document.querySelectorAll("#tabs button");
tabs.forEach(b => b.onclick = () => setTab(b.dataset.t));
function setTab(t){
  tabs.forEach(b => b.classList.toggle("on", b.dataset.t === t));
  ["city","ind","list","src"].forEach(p => document.getElementById("p-" + p).classList.toggle("on", p === t));
  if (t === "ind" && !indOpen){ indOpen = activeInd || IND[0]; renderInd(); }
}

function fmt(v){
  if (typeof v !== "number") return esc(v);
  const a = Math.abs(v);
  const d = a >= 1000 ? 0 : a >= 100 ? 1 : 2;
  return v.toLocaleString("en-US", {maximumFractionDigits: d});
}
function unitHtml(u, v){ return typeof v === "number" ? "<small>" + esc(u) + "</small>" : ""; }
function scoreBar(s, colour){
  if (s === null || s === undefined) return '<div class="scorebar"><span>No score in the Excel</span></div>';
  return '<div class="scorebar"><div class="track"><div class="fill" style="width:' + Math.max(2, s*10) + '%;background:' + colour + '"></div></div><span>' + fmt(s) + " / 10</span></div>";
}
function srcHtml(list){
  return '<div class="src">Source: ' + list.map(s => s[1] ? '<a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[0]) + "</a>" : esc(s[0])).join(" · ") + "</div>";
}
function benchRows(sub){ return sub.rows.filter(r => r[0] !== HOME); }
function acrMain(sub){ const a = sub.rows.filter(r => r[0] === HOME); return a.length ? a[a.length - 1] : null; }
function avgOf(rows){ const n = rows.filter(r => typeof r[1] === "number"); if (!n.length) return null; return n.reduce((s, r) => s + r[1], 0)/n.length; }
function lowerBetter(sub){ return /lower is better/i.test(sub.note || ""); }
function bestOf(sub){
  const n = benchRows(sub).filter(r => typeof r[1] === "number"); if (!n.length) return null;
  return n.reduce((b, r) => (lowerBetter(sub) ? r[1] < b[1] : r[1] > b[1]) ? r : b);
}
function rankOf(sub, row){
  const n = benchRows(sub).filter(r => typeof r[2] === "number").sort((a, b) => b[2] - a[2]);
  const i = n.indexOf(row); return i < 0 ? null : [i + 1, n.length];
}

function renderCity(){
  const el = document.getElementById("p-city");
  if (!selected){
    el.innerHTML = '<p class="empty">Click any city on the globe, or pick one from the <b>Cities</b> tab, to see its data points from the shortlisted indicators workbook.</p>' +
      '<p class="empty">Click an indicator on the left of the globe to filter the cities and open its full data table in <b>Indicator Data</b>.</p>' +
      '<button class="btn" id="goHome">View ' + esc(HOME) + "</button>";
    document.getElementById("goHome").onclick = () => selectCity(HOME);
    return;
  }
  const c = selected;
  let h = '<div class="city-h"><canvas width="44" height="44" id="cityIcon" style="width:44px;height:44px;flex:none"></canvas><div><h3>' + esc(c.name) + "</h3>" +
    '<span class="role' + (c.home ? " home" : "") + '">' + (c.home ? "Home city" : "Benchmark city") + "</span>" +
    '<div class="coords">' + Math.abs(c.lat).toFixed(2) + "°" + (c.lat >= 0 ? "N" : "S") + ", " + Math.abs(c.lon).toFixed(2) + "°" + (c.lon >= 0 ? "E" : "W") + "</div></div></div>";
  h += '<div class="badges">' + c.inds.map(k => '<span class="badge" style="background:' + DATA.colours[k] + '">' + esc(k) + "</span>").join("") + "</div>";

  const groups = IND.filter(k => c.inds.indexOf(k) >= 0 || (DATA.benchmarks[k] || []).some(s => s.rows.some(r => r[0] === c.name)));
  const ordered = activeInd && groups.indexOf(activeInd) >= 0 ? [activeInd].concat(groups.filter(k => k !== activeInd)) : groups;
  ordered.forEach(k => {
    const col = DATA.colours[k];
    h += '<div class="group" style="border-left-color:' + col + '"><h4><span class="sw" style="width:11px;height:11px;border-radius:50%;background:' + col + ';display:inline-block"></span>' + esc(k) + "</h4>";
    let any = false;
    (DATA.benchmarks[k] || []).forEach(sub => {
      const mine = sub.rows.filter(r => r[0] === c.name);
      if (!mine.length) return;
      any = true;
      h += '<div class="metric"><div class="mname">' + esc(sub.name) + "</div>";
      mine.forEach(r => {
        h += '<div class="mval">' + fmt(r[1]) + unitHtml(sub.unit, r[1]) + "</div>";
        if (r[3]) h += '<div class="mlabel">' + esc(r[3]) + "</div>";
        if (r[2] !== null || mine.length === 1) h += scoreBar(r[2], col);
      });
      const avg = avgOf(benchRows(sub)), best = bestOf(sub), acr = acrMain(sub);
      if (c.home){
        if (avg !== null) h += '<div class="cmp">Benchmark average: <b>' + fmt(avg) + "</b> " + esc(sub.unit) + (best ? " · Best: <b>" + esc(best[3] || best[0]) + " " + fmt(best[1]) + "</b>" : "") + "</div>";
      } else {
        const rk = rankOf(sub, mine[0]);
        h += '<div class="cmp">' + (rk ? "Rank " + rk[0] + " of " + rk[1] + " benchmarks by score" : "") +
             (acr ? (rk ? " · " : "") + "ACR: <b>" + fmt(acr[1]) + "</b>" + (typeof acr[1] === "number" ? " " + esc(sub.unit) : "") : "") + "</div>";
      }
      h += srcHtml(sub.sources) + "</div>";
    });
    if (!any) h += '<div class="nodata">No values for this city in the Excel for ' + esc(k) + "." + ((DATA.data_notes[k] || []).length ? " See the data check in Indicator Data." : "") + "</div>";
    if (c.home && (DATA.acr_context[k] || []).length){
      h += "<details><summary>More ACR data (final indicators sheet)</summary>" + ctxHtml(k) + "</details>";
    }
    if (c.home && ((DATA.recommendations || {})[k] || []).length){
      h += "<details><summary>Recommendations (" + DATA.recommendations[k].length + ")</summary>" + recHtml(k, col) + "</details>";
    }
    h += "</div>";
  });
  el.innerHTML = h;
  drawIcon(document.getElementById("cityIcon"), c, 44);
}
function ctxHtml(k){
  return (DATA.acr_context[k] || []).map(x => '<div class="ctx"><b>' + esc(x[0]) + "</b><br>ACR: " + esc(x[1]) +
    (x[2] ? "<br>Benchmark: <b>" + esc(x[2]) + "</b>" : "") + (x[3] ? "<br>Gap: " + esc(x[3]) : "") +
    (x[4] ? "<br>Evidence: " + (x[5] ? '<a href="' + esc(x[5]) + '" target="_blank" rel="noopener">' + esc(x[4]) + "</a>" : esc(x[4])) : "") + "</div>").join("");
}

function recHtml(k, col){
  const list = (DATA.recommendations || {})[k] || [];
  if (!list.length) return "";
  const groups = [], byName = {};
  list.forEach(r => { if (!byName[r[0]]){ byName[r[0]] = []; groups.push(r[0]); } byName[r[0]].push(r); });
  return groups.map(g => '<div class="recsub"><h5>' + esc(g) + "</h5>" + byName[g].map((r, i) =>
    '<div class="rec"><span class="rn" style="background:' + col + '">' + (i + 1) + '</span><div><div class="rt">' + esc(r[1]) + '</div>' +
    ((r[2] || r[3]) ? '<div class="rm">' + (r[2] ? "<span>Who: " + esc(r[2]) + "</span>" : "") + (r[3] ? '<span class="when">When: ' + esc(r[3]) + "</span>" : "") + "</div>" : "") +
    "</div></div>").join("") + "</div>").join("");
}

function renderInd(){
  const k = indOpen, el = document.getElementById("p-ind"), col = DATA.colours[k];
  let h = '<div class="ind-sel">' + IND.map(x => '<button data-k="' + esc(x) + '" class="' + (x === k ? "on" : "") + '"><i style="background:' + DATA.colours[x] + '"></i>' + esc(x) + "</button>").join("") + "</div>";
  h += '<div class="ind-h" style="background:' + col + '"><h3>' + esc(k) + "</h3><p>" + esc(DATA.descriptions[k] || "") + "</p><p>" +
       DATA.indicator_cities[k].length + " cities on the globe</p></div>";
  (DATA.benchmarks[k] || []).forEach(sub => {
    h += '<div class="sub"><h4>' + esc(sub.name) + '</h4><div class="unit">Unit: ' + esc(sub.unit) + "</div>";
    if (sub.note) h += '<div class="note">' + esc(sub.note) + "</div>";
    h += '<div class="rows">';
    sub.rows.forEach(r => {
      const pin = !!cityByName[r[0]], isAcr = r[0] === HOME;
      const nm = isAcr ? (r[3] && r[3].length < 30 ? r[3] : "ACR") : r[0];
      const subl = isAcr ? (r[3] && r[3].length >= 30 ? r[3] : "") : (r[3] || (pin ? "" : "No pin on the globe"));
      h += '<div class="row' + (isAcr ? " acr" : "") + (pin ? "" : " nopin") + (selected && selected.name === r[0] ? " sel" : "") + '" data-c="' + esc(pin ? r[0] : "") + '">' +
        '<div class="rc">' + esc(nm) + (subl ? "<span>" + esc(subl) + "</span>" : "") + "</div>" +
        '<div class="rb">' + (r[2] === null ? '<span style="font-size:11px;color:var(--muted);font-weight:400">no score</span>' :
          '<div class="track"><div class="fill" style="width:' + Math.max(2, r[2]*10) + "%;background:" + (isAcr ? "#262626" : col) + '"></div></div>') + "</div>" +
        '<div class="rv">' + fmt(r[1]) + (r[2] !== null ? '<span style="display:block;font-size:11px;color:var(--muted);font-weight:400">score ' + fmt(r[2]) + "</span>" : "") + "</div></div>";
    });
    const avg = avgOf(benchRows(sub));
    h += "</div>";
    if (avg !== null) h += '<div class="cmp">Benchmark average (excluding ACR): <b>' + fmt(avg) + "</b> " + esc(sub.unit) + "</div>";
    h += srcHtml(sub.sources) + "</div>";
  });
  if ((DATA.acr_context[k] || []).length) h += '<div class="sec-t">ACR position · final indicators sheet</div>' + ctxHtml(k);
  const rh = recHtml(k, col);
  if (rh) h += '<div class="sec-t">Recommendations for ACR · Recommendations sheet</div>' + rh;
  if ((DATA.data_notes[k] || []).length) h += '<div class="sec-t">Data checks</div><div class="warn">' + DATA.data_notes[k].map(n => "<div>" + esc(n) + "</div>").join("") + "</div>";
  el.innerHTML = h;
  el.querySelectorAll(".ind-sel button").forEach(b => b.onclick = () => setIndicator(b.dataset.k, true));
  el.querySelectorAll(".row").forEach(rw => rw.onclick = () => { if (rw.dataset.c) selectCity(rw.dataset.c); });
}

let q = "";
function renderList(){
  const el = document.getElementById("p-list");
  if (!el.querySelector(".search")){
    el.innerHTML = '<input class="search" placeholder="Search cities" id="cq"><div class="clist" id="clist"></div>';
    document.getElementById("cq").oninput = e => { q = e.target.value.toLowerCase(); renderList(); };
  }
  const list = cities.filter(c => cityShown(c) && c.name.toLowerCase().indexOf(q) >= 0)
    .sort((a, b) => (b.home - a.home) || a.name.localeCompare(b.name));
  const box = document.getElementById("clist"); box.innerHTML = "";
  list.forEach(c => {
    const b = document.createElement("button");
    b.className = "citem" + (selected === c ? " sel" : "");
    const ic = document.createElement("canvas"); ic.width = 52; ic.height = 52; ic.style.width = "26px"; ic.style.height = "26px";
    b.appendChild(ic);
    b.insertAdjacentHTML("beforeend", '<span class="cn">' + esc(c.name) + '</span><span class="cc">' + c.inds.length + (c.inds.length === 1 ? " indicator" : " indicators") + "</span>");
    b.onclick = () => selectCity(c.name);
    box.appendChild(b);
    drawIcon(ic, c, 26);
  });
  if (!list.length) box.innerHTML = '<p class="empty">No city matches.</p>';
}
function drawIcon(canvas, c, css){
  const g = canvas.getContext("2d"), s = canvas.width/css, m = css/2, r = css*0.34;
  g.setTransform(s, 0, 0, s, 0, 0); g.clearRect(0, 0, css, css);
  g.fillStyle = c.home ? "#262626" : "#fff"; g.beginPath(); g.arc(m, m, r, 0, 7); g.fill();
  const n = c.inds.length, gap = n > 1 ? 0.18 : 0;
  c.inds.forEach((k, i) => {
    g.beginPath(); g.arc(m, m, r, -Math.PI/2 + i*2*Math.PI/n + gap/2, -Math.PI/2 + (i+1)*2*Math.PI/n - gap/2);
    g.strokeStyle = DATA.colours[k]; g.lineWidth = css*0.13; g.stroke();
  });
}

function renderSources(){
  let h = '<p class="empty">These are the sources listed in the shortlisted indicators workbook for each data point shown on this page.</p>';
  IND.forEach(k => {
    const seen = {}, items = [];
    (DATA.benchmarks[k] || []).forEach(sub => sub.sources.forEach(s => {
      const key = s[0] + "|" + s[1];
      if (!seen[key]){ seen[key] = {s: s, f: []}; items.push(seen[key]); }
      seen[key].f.push(sub.name);
    }));
    (DATA.acr_context[k] || []).forEach(x => { if (x[5]){ const key = x[4] + "|" + x[5]; if (!seen[key]){ seen[key] = {s: [x[4], x[5]], f: []}; items.push(seen[key]); } seen[key].f.push(x[0] + " (ACR evidence)"); } });
    if (!items.length) return;
    h += '<div class="srcgrp"><h4><i style="background:' + DATA.colours[k] + '"></i>' + esc(k) + "</h4><ul>" +
      items.map(it => "<li>" + (it.s[1] ? '<a href="' + esc(it.s[1]) + '" target="_blank" rel="noopener">' + esc(it.s[0]) + "</a>" : esc(it.s[0])) +
        ' <span class="for">for ' + esc(it.f.join(", ")) + "</span></li>").join("") + "</ul></div>";
  });
  h += '<div class="srcgrp"><h4>Map</h4><ul><li>Land outlines: Natural Earth 1:50m, via the world-atlas package</li></ul></div>';
  document.getElementById("p-src").innerHTML = h;
}

/* ---------------- public API (used by the GIF cell) ---------------- */
window.__globe = {
  setView(lon, lat, scale){ anim = null; frozen = true; view.lon = -lon; view.lat = lat; if (scale) view.k = scale; },
  resume(){ frozen = false; },
  select(name){ selectCity(name); },
  deselect(){ deselect(); },
  setSpeed(key){ const b = document.querySelector('#speed button[data-s="' + key + '"]'); if (b) b.click(); },
  setIndicator(k){ setIndicator(k || null, !!k); }
};

resize(); renderChips(); renderCity(); renderList(); renderSources();
requestAnimationFrame(frame);
})();
